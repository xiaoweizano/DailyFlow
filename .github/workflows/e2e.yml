name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: Asia/Shanghai

jobs:
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

  windows-desktop:
    name: Windows desktop smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked

      - name: Install Microsoft Edge WebDriver
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable

      - name: Verify Microsoft Edge WebDriver
        run: msedgedriver --version

      - name: Build desktop application
        run: pnpm --filter @dailyflow/desktop exec tauri build --features desktop-shell --no-bundle

      - name: Run desktop smoke test
        shell: pwsh
        run: ./scripts/run-desktop-smoke.ps1

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/dailyflow-tauri-driver
          if-no-files-found: warn
          retention-days: 7
