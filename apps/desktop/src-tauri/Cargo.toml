[package]
name = "dailyflow-desktop"
version = "0.1.0"
description = "DailyFlow desktop application shell"
authors = ["DailyFlow"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = "2.7.3"
tempfile = "3"
unicode-normalization = "0.1"
uuid = { version = "1.8", features = ["v7"] }

[features]
desktop-shell = ["dep:tauri"]
custom-protocol = ["desktop-shell", "tauri/custom-protocol"]
